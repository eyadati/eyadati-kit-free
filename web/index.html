<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="احجز مواعيدك الطبية عن بعد">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eyadati">

  <link rel="apple-touch-icon" sizes="120x120" href="icons/Icon-128.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-144.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Eyadati</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Preload core assets -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
    }
    
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #E5E7EB;
      border-top: 4px solid #3F51B5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    .loading-text {
      margin-top: 20px;
      color: #6B7280;
      font-size: 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Chargement...</div>
  </div>
  
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').style.display = 'none';
    });

    var newWorkerWaiting = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg) {
        setInterval(function() { reg.update(); }, 15 * 60 * 1000);

        reg.addEventListener('updatefound', function() {
          var installingWorker = reg.installing;
          if (!installingWorker) return;

          installingWorker.addEventListener('statechange', function() {
            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
              newWorkerWaiting = installingWorker;
              window.dispatchEvent(new CustomEvent('pwaUpdateAvailable'));
            }
          });
        });
      });

      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }

    window.applyAppUpdate = function() {
      if (newWorkerWaiting) {
        newWorkerWaiting.postMessage({ type: 'SKIP_WAITING' });
      } else {
        window.location.reload();
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
