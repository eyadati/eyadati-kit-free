name: eyadati_kit
description: "Eyadati Kit - Modular clinic booking starter (free tier)"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.8.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  lucide_flutter: ^1.14.0
  flutter_slidable: ^3.1.2
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3
  flutter_animate: ^4.5.2
  syncfusion_flutter_calendar: ^28.2.11
  syncfusion_flutter_core: ^28.2.11
  flutter_settings_ui: ^3.0.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.2
  logger: ^2.5.0
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  modal_bottom_sheet: ^3.0.0

dev_dependencies:
  http: ^1.2.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pro.png"
  web:
    generate: true
    image_path: "assets/pro.png"
    background_color: "#FFFFFF"
    theme_color: "#0D6EFD"
  windows:
    generate: true
    image_path: "assets/pro.png"
  macos:
    generate: true
    image_path: "assets/pro.png"
  linux:
    generate: true
    image_path: "assets/pro.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
